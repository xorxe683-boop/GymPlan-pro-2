name: Crear APK GymPlan Pro 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto
        run: |
          unzip -o GymPlan-Pro-2-Nube.zip -d proyecto

      - name: Encontrar proyecto Android
        run: |
          echo "Buscando proyecto Gradle..."
          find proyecto -name settings.gradle -o -name settings.gradle.kts

      - name: Crear APK
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GymPlan-Pro-2-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
